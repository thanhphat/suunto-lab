[project]
name = "suunto-lab"
version = "0.1.0"
description = "Self-hosted store and analysis for Suunto FIT files: API, worker, web dashboard and read-only MCP server."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115.14",
    "uvicorn[standard]>=0.34.3",
    "python-multipart>=0.0.20",
    "psycopg[binary,pool]>=3.3.6",
    "numpy>=2.5.3",
    "garmin-fit-sdk>=21.218.0",
    "mcp>=2.3.0",
]

[tool.uv]
package = false
